name: Build Windows package
on:
  workflow_dispatch:
  push:
    branches: ['main', 'portable-windows']
    tags: ['v*']
  pull_request:
    paths:
      - '**.py'
      - '**.cmd'
      - 'requirements.txt'
      - 'procedures/**'
      - 'examples/**'
      - 'web/**'
      - 'extension/**'
      - 'native_config.json'
      - '.github/workflows/windows-release.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt PyInstaller==6.16.0
      - name: Build and smoke test release
        run: python build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: GCH-Check-My-Work-Windows-x64
          path: |
            dist/GCH-Check-My-Work-Windows-x64.zip
            dist/GCH-Check-My-Work-Windows-x64.zip.sha256
          if-no-files-found: error
